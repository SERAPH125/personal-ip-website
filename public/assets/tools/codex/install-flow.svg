<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex 六步安装流程</title><desc id="desc">从环境检查到完成首个任务的六步流程图</desc>
  <rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">Codex 六步上手</text>
  <text x="100" y="175" fill="#667085" font-size="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">从安装到完成第一个可复核的小任务</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <g transform="translate(100 260)"><rect width="400" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="62" cy="60" r="32" fill="#3568e8"/><text x="52" y="72" fill="#fff" font-size="30" font-weight="700">1</text><text x="115" y="68" fill="#20242c" font-size="30" font-weight="700">检查 Node.js</text><text x="115" y="116" fill="#667085" font-size="23">确认终端可正常运行</text></g>
    <g transform="translate(600 260)"><rect width="400" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="62" cy="60" r="32" fill="#3568e8"/><text x="52" y="72" fill="#fff" font-size="30" font-weight="700">2</text><text x="115" y="68" fill="#20242c" font-size="30" font-weight="700">安装 CLI</text><text x="115" y="116" fill="#667085" font-size="23">使用官方 npm 包</text></g>
    <g transform="translate(1100 260)"><rect width="400" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="62" cy="60" r="32" fill="#3568e8"/><text x="52" y="72" fill="#fff" font-size="30" font-weight="700">3</text><text x="115" y="68" fill="#20242c" font-size="30" font-weight="700">验证版本</text><text x="115" y="116" fill="#667085" font-size="23">运行 codex --version</text></g>
    <path d="M510 345h75m425 0h75" stroke="#9bb5ef" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(100 520)"><rect width="400" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="62" cy="60" r="32" fill="#3568e8"/><text x="52" y="72" fill="#fff" font-size="30" font-weight="700">4</text><text x="115" y="68" fill="#20242c" font-size="30" font-weight="700">登录账户</text><text x="115" y="116" fill="#667085" font-size="23">按终端提示授权</text></g>
    <g transform="translate(600 520)"><rect width="400" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="62" cy="60" r="32" fill="#3568e8"/><text x="52" y="72" fill="#fff" font-size="30" font-weight="700">5</text><text x="115" y="68" fill="#20242c" font-size="30" font-weight="700">进入项目</text><text x="115" y="116" fill="#667085" font-size="23">先确认当前目录</text></g>
    <g transform="translate(1100 520)"><rect width="400" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="62" cy="60" r="32" fill="#3568e8"/><text x="52" y="72" fill="#fff" font-size="30" font-weight="700">6</text><text x="115" y="68" fill="#20242c" font-size="30" font-weight="700">审阅首个任务</text><text x="115" y="116" fill="#667085" font-size="23">先解释，再批准改动</text></g>
    <path d="M510 605h75m425 0h75" stroke="#9bb5ef" stroke-width="8" stroke-linecap="round"/>
  </g>
  <text x="100" y="825" fill="#667085" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">原创流程示意 · 核验 2026-08-26</text>
</svg>
