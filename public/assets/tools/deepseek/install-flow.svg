<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">DeepSeek 六步使用流程</title><desc id="desc">从识别官方入口到核验回答的流程图</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}.h{font-weight:800;fill:#20242c}.s{fill:#667085}.n{fill:#fff;font-size:30px;font-weight:700}.b{fill:#fff;stroke:#dce2ef;stroke-width:3}.c{fill:#3568e8}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" font-size="58" class="h">DeepSeek 六步上手</text><text x="100" y="175" font-size="28" class="s">选择入口 → 官方登录 → 写清问题 → 核验答案</text><g class="b"><rect x="100" y="260" width="400" height="170" rx="24"/><rect x="600" y="260" width="400" height="170" rx="24"/><rect x="1100" y="260" width="400" height="170" rx="24"/><rect x="100" y="520" width="400" height="170" rx="24"/><rect x="600" y="520" width="400" height="170" rx="24"/><rect x="1100" y="520" width="400" height="170" rx="24"/></g><g class="c"><circle cx="162" cy="320" r="32"/><circle cx="662" cy="320" r="32"/><circle cx="1162" cy="320" r="32"/><circle cx="162" cy="580" r="32"/><circle cx="662" cy="580" r="32"/><circle cx="1162" cy="580" r="32"/></g><g class="n"><text x="152" y="332">1</text><text x="652" y="332">2</text><text x="1152" y="332">3</text><text x="152" y="592">4</text><text x="652" y="592">5</text><text x="1152" y="592">6</text></g><g class="h" font-size="30"><text x="215" y="328">选择场景</text><text x="715" y="328">认准官网</text><text x="1215" y="328">完成登录</text><text x="215" y="588">保护隐私</text><text x="715" y="588">结构化提问</text><text x="1215" y="588">核验答案</text></g><g class="s" font-size="23"><text x="215" y="376">网页 / App / API</text><text x="715" y="376">deepseek.com</text><text x="1215" y="376">不共享验证码</text><text x="215" y="636">去除个人敏感信息</text><text x="715" y="636">目标 + 背景 + 格式</text><text x="1215" y="636">重要信息查原始来源</text></g><path d="M510 345h75m425 0h75M510 605h75m425 0h75" stroke="#9bb5ef" stroke-width="8" stroke-