<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">DeepSeek 高质量提问结构示意</title><desc id="desc">目标、背景、限制和输出格式四部分提示词模板</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">第一次提问：四块就够</text><text x="100" y="175" fill="#667085" font-size="28">先写清任务，再要求注明不确定性</text><g transform="translate(100 260)"><g><rect width="640" height="190" rx="26" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="72" cy="70" r="35" fill="#3568e8"/><text x="61" y="82" fill="#fff" font-size="30" font-weight="700">1</text><text x="135" y="73" fill="#20242c" font-size="31" font-weight="700">目标</text><text x="135" y="125" fill="#667085" font-size="24">我要得到什么结果？</text></g><g transform="translate(760)"><rect width="640" height="190" rx="26" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="72" cy="70" r="35" fill="#3568e8"/><text x="61" y="82" fill="#fff" font-size="30" font-weight="700">2</text><text x="135" y="73" fill="#20242c" font-size="31" font-weight="700">背景</text><text x="135" y="125" fill="#667085" font-size="24">读者、场景和已有信息</text></g><g transform="translate(0 245)"><rect width="640" height="190" rx="26" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="72" cy="70" r="35" fill="#3568e8"/><text x="61" y="82" fill="#fff" font-size="30" font-weight="700">3</text><text x="135" y="73" fill="#20242c" font-size="31" font-weight="700">限制</text><text x="135" y="125" fill="#667085" font-size="24">字数、语气、不能编造</text></g><g transform="translate(760 245)"><rect width="640" height="190" rx="26" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="72" cy="70" r="35" fill="#3568e8"/><text x="61" y="82" fill="#fff" font-size="30" font-weight="700">4</text><text x="135" y="73" fill="#20242c" font-size="31" font-weight="700">格式</text><text x="135" y="125" fill="#667085" font-size="24">表格、清单或分步骤</text></g></g><rect x="100" y="760" width="1400" height="80" rx="20" fill="#e9efff"/><text x="145" y="810" fill="#3568e8" font-size="25" font-weight="700">建议追加：“不确定的地方请明确标注；重要事实请给我核验思路。”</text></svg>
