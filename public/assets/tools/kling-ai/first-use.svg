<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">可灵 AI 第一个镜头提示词示意</title><desc id="desc">主体、动作、环境、镜头和风格五段式视频提示词</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">一个镜头，五段提示</text><text x="100" y="175" fill="#667085" font-size="28">第一次先做短镜头，减少变量</text><g transform="translate(100 270)"><rect width="1400" height="180" rx="30" fill="#20242c"/><text x="60" y="70" fill="#9ec1ff" font-size="25" font-weight="700">示例</text><text x="60" y="125" fill="#fff" font-size="26">清晨的海边，一位穿黄色雨衣的人向前慢走，薄雾，镜头缓慢后退，电影感自然光。</text><g transform="translate(0 240)"><rect width="250" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="75" y="70" fill="#3568e8" font-size="29" font-weight="700">主体</text><text x="52" y="120" fill="#667085" font-size="22">谁 / 什么</text></g><g transform="translate(287 240)"><rect width="250" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="75" y="70" fill="#3568e8" font-size="29" font-weight="700">动作</text><text x="52" y="120" fill="#667085" font-size="22">正在做什么</text></g><g transform="translate(574 240)"><rect width="250" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="75" y="70" fill="#3568e8" font-size="29" font-weight="700">环境</text><text x="52" y="120" fill="#667085" font-size="22">时间 / 地点</text></g><g transform="translate(861 240)"><rect width="250" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="75" y="70" fill="#3568e8" font-size="29" font-weight="700">镜头</text><text x="52" y="120" fill="#667085" font-size="22">景别 / 运镜</text></g><g transform="translate(1148 240)"><rect width="250" height="170" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="75" y="70" fill="#3568e8" font-size="29" font-weight="700">风格</text><text x="52" y="120" fill="#667085" font-size="22">光线 / 质感</text></g></g><text x="100" y="820" fill="#667085" font-size="24">生成后只改一个变量：先改动作，再改镜头，最后改风格</text></svg>
