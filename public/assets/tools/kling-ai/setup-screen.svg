<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">可灵 AI 模式选择示意</title><desc id="desc">文生视频和图生视频两种入口对比示意</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">先选模式，再写镜头</text><text x="100" y="175" fill="#667085" font-size="28">界面示意 · 模型、时长、分辨率与积分规则以官方实时页面为准</text><g transform="translate(100 260)"><rect width="660" height="430" rx="30" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect x="70" y="60" width="520" height="170" rx="22" fill="#3568e8"/><text x="145" y="130" fill="#fff" font-size="34" font-weight="700">文生视频</text><text x="145" y="185" fill="#dbe7ff" font-size="24">只有想法，没有起始图片</text><text x="70" y="300" fill="#20242c" font-size="26" font-weight="700">适合：</text><text x="150" y="300" fill="#667085" font-size="24">概念镜头、氛围测试</text><text x="70" y="355" fill="#20242c" font-size="26" font-weight="700">输入：</text><text x="150" y="355" fill="#667085" font-size="24">主体 + 动作 + 环境 + 镜头</text><g transform="translate(740)"><rect width="660" height="430" rx="30" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect x="70" y="60" width="520" height="170" rx="22" fill="#6b5dd3"/><path d="M130 190l95-90 75 65 60-55 120 80z" fill="#fff" opacity=".9"/><text x="360" y="130" fill="#fff" font-size="34" font-weight="700">图生视频</text><text x="360" y="180" fill="#eeeaff" font-size="24">已有图片，想让它动起来</text><text x="70" y="300" fill="#20242c" font-size="26" font-weight="700">适合：</text><text x="150" y="300" fill="#667085" font-size="24">角色一致、产品动态</text><text x="70" y="355" fill="#20242c" font-size="26" font-weight="700">输入：</text><text x="150" y="355" fill="#667085" font-size="24">图片 + 动作 + 运镜</text></g></g><rect x="100" y="745" width="1400" height="90" rx="20" fill="#fff4e5"/><text x="145" y="800" fill="#b54708" font-size="24" font-weight="700">上传图片前确认肖像授权、素材版权和平台当前内容规范</text></svg>
