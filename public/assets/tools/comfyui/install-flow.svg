<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ComfyUI 六步安装流程</title><desc id="desc">从硬件检查到保存首张图片的六步流程图</desc><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">ComfyUI 六步上手</text><text x="100" y="175" fill="#667085" font-size="28" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">先跑官方模板，再学习节点与模型管理</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif"><g fill="#fff" stroke="#dce2ef" stroke-width="3"><rect x="100" y="260" width="400" height="170" rx="24"/><rect x="600" y="260" width="400" height="170" rx="24"/><rect x="1100" y="260" width="400" height="170" rx="24"/><rect x="100" y="520" width="400" height="170" rx="24"/><rect x="600" y="520" width="400" height="170" rx="24"/><rect x="1100" y="520" width="400" height="170" rx="24"/></g><g fill="#3568e8"><circle cx="162" cy="320" r="32"/><circle cx="662" cy="320" r="32"/><circle cx="1162" cy="320" r="32"/><circle cx="162" cy="580" r="32"/><circle cx="662" cy="580" r="32"/><circle cx="1162" cy="580" r="32"/></g><g fill="#fff" font-size="30" font-weight="700"><text x="152" y="332">1</text><text x="652" y="332">2</text><text x="1152" y="332">3</text><text x="152" y="592">4</text><text x="652" y="592">5</text><text x="1152" y="592">6</text></g><g fill="#20242c" font-size="30" font-weight="700"><text x="215" y="328">检查硬件</text><text x="715" y="328">下载桌面版</text><text x="1215" y="328">选择安装盘</text><text x="215" y="588">添加模型</text><text x="715" y="588">加载模板</text><text x="1215" y="588">排队生成</text></g><g fill="#667085" font-size="23"><text x="215" y="376">显卡与剩余空间优先</text><text x="715" y="376">只走官方安装文档</text><text x="1215" y="376">给模型留出容量</text><text x="215" y="636">核对来源与许可证</text><text x="715" y="636">先用官方基础工作流</text><text x="1215" y="636">确认输出目录</text></g><path d="M510 345h75m425 0h75M510 605h75m425 0h75" stroke="#9bb5ef" stroke-width="8" stroke-linecap="round"/></g><text x="100" y="825" fill="#667085" font-size="24" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">原创流程示意 · 核验 2026-08-26</text></svg>
