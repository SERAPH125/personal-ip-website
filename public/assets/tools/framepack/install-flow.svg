<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">FramePack 六步安装流程</title><desc id="desc">原创流程示意，不代表产品界面</desc><style>.ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f7f9fd"/><text class="ui" x="90" y="105" fill="#20242c" font-size="48" font-weight="800">FramePack · 从安装到首个结果</text><text class="ui" x="90" y="157" fill="#667085" font-size="23">原创流程示意 · 以官方当前文档为准</text><g class="ui" transform="translate(90 230)"><rect width="430" height="205" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="55" cy="55" r="31" fill="#3568e8"/><text x="55" y="65" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">1</text><text x="105" y="65" fill="#20242c" font-size="28" font-weight="750">核对仓库</text><text x="40" y="125" fill="#667085" font-size="21">确认 NVIDIA 显卡、驱动和显存</text><rect x="40" y="157" width="350" height="10" rx="5" fill="#3568e8"/></g><g class="ui" transform="translate(590 230)"><rect width="430" height="205" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="55" cy="55" r="31" fill="#3568e8"/><text x="55" y="65" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">2</text><text x="105" y="65" fill="#20242c" font-size="28" font-weight="750">检查硬件</text><text x="40" y="125" fill="#667085" font-size="21">预留模型、缓存和输出空间</text><rect x="40" y="157" width="350" height="10" rx="5" fill="#3568e8"/></g><g class="ui" transform="translate(1090 230)"><rect width="430" height="205" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="55" cy="55" r="31" fill="#3568e8"/><text x="55" y="65" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">3</text><text x="105" y="65" fill="#20242c" font-size="28" font-weight="750">下载环境</text><text x="40" y="125" fill="#667085" font-size="21">只打开 lllyasviel/FramePack 官方仓库</text><rect x="40" y="157" width="350" height="10" rx="5" fill="#e9efff"/></g><g class="ui" transform="translate(90 510)"><rect width="430" height="205" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="55" cy="55" r="31" fill="#3568e8"/><text x="55" y="65" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">4</text><text x="105" y="65" fill="#20242c" font-size="28" font-weight="750">准备模型</text><text x="40" y="125" fill="#667085" font-size="21">准备一张可公开的测试图片</text><rect x="40" y="157" width="350" height="10" rx="5" fill="#e9efff"/></g><g class="ui" transform="translate(590 510)"><rect width="430" height="205" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="55" cy="55" r="31" fill="#3568e8"/><text x="55" y="65" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">5</text><text x="105" y="65" fill="#20242c" font-size="28" font-weight="750">启动本地界面</text><text x="40" y="125" fill="#667085" font-size="21">确认 NVIDIA 显卡、驱动和显存</text><rect x="40" y="157" width="350" height="10" rx="5" fill="#e9efff"/></g><g class="ui" transform="translate(1090 510)"><rect width="430" height="205" rx="24" fill="#fff" stroke="#dce2ef" stroke-width="3"/><circle cx="55" cy="55" r="31" fill="#3568e8"/><text x="55" y="65" text-anchor="middle" fill="#fff" font-size="25" font-weight="800">6</text><text x="105" y="65" fill="#20242c" font-size="28" font-weight="750">生成短视频</text><text x="40" y="125" fill="#667085" font-size="21">预留模型、缓存和输出空间</text><rect x="40" y="157" width="350" height="10" rx="5" fill="#e9efff"/></g></svg>
