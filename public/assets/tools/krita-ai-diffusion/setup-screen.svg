<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Krita AI Diffusion 安装重点</title><desc id="desc">三个安装重点的原创示意，不是产品界面截图</desc><style>.ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text class="ui" x="100" y="115" fill="#20242c" font-size="50" font-weight="800">安装时只盯住这三件事</text><text class="ui" x="100" y="170" fill="#667085" font-size="24">Krita AI Diffusion · 原创结构示意</text><g class="ui" transform="translate(100 260)"><rect width="430" height="410" rx="28" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect x="0" y="0" width="430" height="18" rx="9" fill="#3568e8"/><text x="40" y="92" fill="#3568e8" font-size="24" font-weight="800">01</text><text x="40" y="155" fill="#20242c" font-size="30" font-weight="750">使用 Release ZIP</text><text x="40" y="225" fill="#667085" font-size="21">安装 Krita 5.2 或更高版本</text><path d="M40 300h350" stroke="#dce2ef" stroke-width="3"/><text x="40" y="350" fill="#0f8f6f" font-size="21">确认后再进入下一步</text></g><g class="ui" transform="translate(600 260)"><rect width="430" height="410" rx="28" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect x="0" y="0" width="430" height="18" rx="9" fill="#73a0ff"/><text x="40" y="92" fill="#3568e8" font-size="24" font-weight="800">02</text><text x="40" y="155" fill="#20242c" font-size="30" font-weight="750">启用 AI Docker</text><text x="40" y="225" fill="#667085" font-size="21">从官方 Releases 下载插件 ZIP</text><path d="M40 300h350" stroke="#dce2ef" stroke-width="3"/><text x="40" y="350" fill="#0f8f6f" font-size="21">确认后再进入下一步</text></g><g class="ui" transform="translate(1100 260)"><rect width="430" height="410" rx="28" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect x="0" y="0" width="430" height="18" rx="9" fill="#b9cdfa"/><text x="40" y="92" fill="#3568e8" font-size="24" font-weight="800">03</text><text x="40" y="155" fill="#20242c" font-size="30" font-weight="750">本地与云端后端分清</text><text x="40" y="225" fill="#667085" font-size="21">更新显卡驱动并检查显存</text><path d="M40 300h350" stroke="#dce2ef" stroke-width="3"/><text x="40" y="350" fill="#0f8f6f" font-size="21">确认后再进入下一步</text></g></svg>
