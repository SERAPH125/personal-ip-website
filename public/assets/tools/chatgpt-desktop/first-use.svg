<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">ChatGPT Desktop 首次使用验收</title><desc id="desc">首次任务与验收标准的原创示意</desc><style>.ui{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f7f9fd"/><text class="ui" x="100" y="115" fill="#20242c" font-size="50" font-weight="800">第一次使用：小任务、可复核、能回退</text><text class="ui" x="100" y="170" fill="#667085" font-size="24">ChatGPT Desktop · 原创验收示意</text><g class="ui" transform="translate(100 245)"><rect width="875" height="475" rx="30" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="45" y="75" fill="#3568e8" font-size="23" font-weight="800">FIRST TASK</text><text x="45" y="135" fill="#20242c" font-size="29" font-weight="750">启动官方客户端并登录</text><rect x="45" y="185" width="785" height="150" rx="18" fill="#f2f5fb"/><text x="75" y="235" fill="#4b5565" font-size="21">请把下面三条公开信息整理成表格，只使用我提供的内容，并把不确定项</text><text x="75" y="278" fill="#4b5565" font-size="21">标为“待核验”。</text><text x="45" y="405" fill="#667085" font-size="21">先验证流程，再增加素材、权限或参数。</text></g><g class="ui" transform="translate(1020 245)"><rect width="480" height="475" rx="30" fill="#20242c"/> <text x="40" y="72" fill="#fff" font-size="27" font-weight="750">完成标准</text><g transform="translate(40 125)"><circle cx="18" cy="18" r="18" fill="#73a0ff"/><path d="M10 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4"/><text x="55" y="27" fill="#fff" font-size="22">回答遵守格式</text></g><g transform="translate(40 220)"><circle cx="18" cy="18" r="18" fill="#73a0ff"/><path d="M10 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4"/><text x="55" y="27" fill="#fff" font-size="22">没有补造事实</text></g><g transform="translate(40 315)"><circle cx="18" cy="18" r="18" fill="#73a0ff"/><path d="M10 18l6 6 11-14" fill="none" stroke="#fff" stroke-width="4"/><text x="55" y="27" fill="#fff" font-size="22">知道如何删除测试对话</text></g></g></svg>
