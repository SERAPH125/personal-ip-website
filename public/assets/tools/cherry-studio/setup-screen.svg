<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cherry Studio 服务商设置示意</title><desc id="desc">添加模型服务商、API 地址和密钥的安全示意</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">添加模型服务商</text><text x="100" y="175" fill="#667085" font-size="28">界面示意 · 字段名称以 Cherry Studio 当前版本为准</text><g transform="translate(100 235)"><rect width="1400" height="560" rx="30" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect width="300" height="560" rx="30" fill="#20242c"/><text x="45" y="75" fill="#fff" font-size="27" font-weight="700">设置</text><rect x="35" y="110" width="230" height="58" rx="14" fill="#3568e8"/><text x="70" y="148" fill="#fff" font-size="23">模型服务</text><text x="70" y="220" fill="#cbd5e1" font-size="23">数据与备份</text><text x="70" y="285" fill="#cbd5e1" font-size="23">网络代理</text><text x="360" y="75" fill="#20242c" font-size="28" font-weight="700">服务商 A</text><text x="360" y="135" fill="#667085" font-size="22">API 地址</text><rect x="360" y="160" width="900" height="62" rx="14" fill="#f2f5fb"/><text x="390" y="200" fill="#4b5565" font-size="22">https://api.example.com/v1</text><text x="360" y="275" fill="#667085" font-size="22">API 密钥</text><rect x="360" y="300" width="900" height="62" rx="14" fill="#f2f5fb"/><text x="390" y="340" fill="#4b5565" font-size="25">••••••••••••••••</text><text x="360" y="415" fill="#667085" font-size="22">默认模型</text><rect x="360" y="440" width="620" height="62" rx="14" fill="#f2f5fb"/><text x="390" y="480" fill="#4b5565" font-size="22">选择服务商当前可用模型</text><rect x="1080" y="440" width="180" height="62" rx="14" fill="#3568e8"/><text x="1125" y="480" fill="#fff" font-size="22">连通测试</text></g><text x="100" y="850" fill="#b54708" font-size="24" font-weight="700">不要在截图、聊天记录或配置导出中暴露真实 API 密钥</text></svg>
