<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Cherry Studio 第一次对话示意</title><desc id="desc">选择服务商与模型并发送无敏感信息测试问题的示意</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">第一次对话：先确认模型</text><text x="100" y="175" fill="#667085" font-size="28">界面示意 · 先用无敏感信息的短问题测试</text><g transform="translate(100 235)"><rect width="1400" height="560" rx="30" fill="#fff" stroke="#dce2ef" stroke-width="3"/><rect x="45" y="45" width="420" height="62" rx="14" fill="#e9efff"/><text x="80" y="85" fill="#3568e8" font-size="23" font-weight="700">服务商 A　/　模型 1 ▾</text><rect x="45" y="150" width="850" height="105" rx="18" fill="#f2f5fb"/><text x="80" y="195" fill="#4b5565" font-size="23">请把下面三条公开信息整理成表格，</text><text x="80" y="232" fill="#4b5565" font-size="23">不要补充未提供的事实。</text><rect x="505" y="300" width="850" height="130" rx="18" fill="#e9efff"/><text x="545" y="350" fill="#20242c" font-size="23">已按“事项 / 日期 / 来源”整理。</text><text x="545" y="395" fill="#667085" font-size="21">请核对原始来源后再使用。</text><rect x="45" y="475" width="1160" height="58" rx="14" fill="#fff" stroke="#dce2ef" stroke-width="3"/><text x="80" y="512" fill="#98a2b3" font-size="22">继续追问……</text><rect x="1230" y="475" width="125" height="58" rx="14" fill="#3568e8"/><text x="1270" y="512" fill="#fff" font-size="22">发送</text></g><text x="100" y="850" fill="#667085" font-size="24">核对：服务商、模型、费用规则、回答依据</text></svg>
