<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">TRAE 第一次使用示意</title><desc id="desc">先只读解释项目再审阅小修改的对话流程</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">第一次任务：先读，再改</text><text x="100" y="175" fill="#667085" font-size="28">界面示意 · 不对应特定版本</text><g transform="translate(100 245)"><rect width="1400" height="520" rx="30" fill="#20242c"/><rect x="45" y="45" width="1310" height="110" rx="18" fill="#fff"/><text x="80" y="90" fill="#3568e8" font-size="23" font-weight="700">01 · 只读请求</text><text x="80" y="132" fill="#4b5565" font-size="24">请解释项目结构和启动方式，先不要修改文件。</text><rect x="45" y="190" width="1310" height="110" rx="18" fill="#f2f5fb"/><text x="80" y="235" fill="#3568e8" font-size="23" font-weight="700">02 · 边界清晰的小修改</text><text x="80" y="277" fill="#4b5565" font-size="24">只修正文档中的一处错字，并告诉我验证方法。</text><rect x="45" y="335" width="830" height="125" rx="18" fill="#123824"/><text x="80" y="382" fill="#a7f3d0" font-size="23" font-weight="700">03 · 查看差异</text><text x="80" y="427" fill="#fff" font-size="24">+ 一处新增　- 一处删除　✓ 测试未受影响</text><rect x="940" y="350" width="350" height="80" rx="18" fill="#3568e8"/><text x="1030" y="400" fill="#fff" font-size="26" font-weight="700">人工确认后接受</text></g><text x="100" y="835" fill="#667085" font-size="24">底线：密钥、客户数据和个人目录不进入练习项目</text></svg>
