<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">TRAE 官方下载选择示意</title><desc id="desc">Windows、macOS 和 Linux 下载入口结构示意</desc><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif}</style><rect width="1600" height="900" fill="#f6f8fc"/><text x="100" y="120" fill="#20242c" font-size="58" font-weight="800">先核对系统，再下载</text><text x="100" y="175" fill="#667085" font-size="28">页面结构示意 · 实际按钮、版本与系统要求以 TRAE 官网为准</text><g transform="translate(100 260)"><rect width="1400" height="450" rx="30" fill="#fff" stroke="#dce2ef" stroke-width="3"/><g transform="translate(70 70)"><rect width="360" height="300" rx="24" fill="#f8fafc" stroke="#dce2ef" stroke-width="3"/><rect x="120" y="45" width="120" height="90" rx="14" fill="#3568e8"/><text x="135" y="102" fill="#fff" font-size="24" font-weight="700">WIN</text><text x="105" y="185" fill="#20242c" font-size="29" font-weight="700">Windows</text><text x="95" y="230" fill="#667085" font-size="22">10 / 11 · x64</text><rect x="95" y="255" width="170" height="45" rx="12" fill="#3568e8"/><text x="138" y="285" fill="#fff" font-size="20">下载</text></g><g transform="translate(520 70)"><rect width="360" height="300" rx="24" fill="#f8fafc" stroke="#dce2ef" stroke-width="3"/><circle cx="180" cy="90" r="55" fill="#20242c"/><text x="143" y="102" fill="#fff" font-size="24" font-weight="700">macOS</text><text x="125" y="185" fill="#20242c" font-size="29" font-weight="700">macOS</text><text x="82" y="230" fill="#667085" font-size="22">Apple / Intel 芯片</text><rect x="95" y="255" width="170" height="45" rx="12" fill="#3568e8"/><text x="138" y="285" fill="#fff" font-size="20">下载</text></g><g transform="translate(970 70)"><rect width="360" height="300" rx="24" fill="#f8fafc" stroke="#dce2ef" stroke-width="3"/><rect x="120" y="40" width="120" height="100" rx="50" fill="#6b5dd3"/><text x="150" y="100" fill="#fff" font-size="24" font-weight="700">LNX</text>